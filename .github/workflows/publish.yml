name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); no NPM_TOKEN secret

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@^11.5.1 && npm --version
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Verify tag matches package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --access public
